# ── Конфигурация SonarQube (п. 12) ──────────────────────────────────────────
# Общий файл для backend и frontend. Локальный анализ:
#   sonar-scanner -Dsonar.login=<TOKEN> -Dsonar.host.url=http://localhost:9000
#
# Облачная версия (SonarQube Cloud) подключается как этап CI/CD (см. ci.yml).

sonar.projectKey=smart-calendar
sonar.projectName=Smart Calendar
sonar.projectVersion=1.0.0

# Анализируемые языки и каталоги
sonar.sourceEncoding=UTF-8
sonar.sources=.

# Исключаем артефакты сборки и сторонние зависимости
sonar.exclusions=**/node_modules/**,**/.next/**,**/.git/**,**/coverage/**,**/dist/**

# Python-бэкенд
sonar.python.version=3.12

# Правила качества
sonar.qualitygate.wait=true