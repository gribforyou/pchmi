# ── Локальный SonarQube через Docker (п. 12) ────────────────────────────────
# Запуск:
#   docker compose -f sonar.compose.yml up -d
#   http://localhost:9000  (login: admin, password: admin, затем сменить)
#
# После старта создать токен и запустить анализ:
#   cd backend && sonar-scanner -Dsonar.login=<TOKEN>
#   cd frontend && sonar-scanner -Dsonar.login=<TOKEN>

services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: