name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test-backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: lab4/task6/backend
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: lab4/task6/backend
        run: pytest -v

  test-frontend:
    name: Frontend build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: lab4/task6/frontend
        run: npm install

      - name: Build
        working-directory: lab4/task6/frontend
        run: npm run build

  test-mobile:
    name: Mobile build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: lab4/task6/mobile
        run: npm install

      - name: Build (Expo web export)
        working-directory: lab4/task6/mobile
        run: npm run build

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=smart-calendar
            -Dsonar.projectName=Smart Calendar
            -Dsonar.sources=.
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=false

  build:
    name: Build Docker images + Swagger
    runs-on: ubuntu-latest
    needs: [test-backend, sonarqube]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Swagger (OpenAPI)
        working-directory: lab4/task6/backend
        run: |
          pip install -r requirements.txt
          python -c "from app import app; open('swagger.json','w').write(app.openapi().to_json())"

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: lab4/task6/backend
          push: false
          tags: smart-calendar/backend:latest
          outputs: type=docker,dest=/tmp/backend.tar

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: lab4/task6/frontend
          push: false
          tags: smart-calendar/frontend:latest
          outputs: type=docker,dest=/tmp/frontend.tar

      - name: Build mobile image
        uses: docker/build-push-action@v5
        with:
          context: lab4/task6/mobile
          push: false
          tags: smart-calendar/mobile:latest
          outputs: type=docker,dest=/tmp/mobile.tar

  deploy:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render
        uses: bounceapp/render-action@v1
        with:
          render-token: ${{ secrets.RENDER_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          wait: true